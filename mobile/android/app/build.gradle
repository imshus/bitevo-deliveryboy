plugins {
    id 'com.android.application'
}

// Where the app lives. The WebView opens appUrl (the rider web app, frontend/); the location service posts
// to apiUrl + /api/rider/location. apiUrl is the same address unless the API is on another domain.
// The default is the dev server as the Android emulator sees it (10.0.2.2 is the PC's own 127.0.0.1).
//   gradlew assembleRelease -PappUrl=https://rider.bitevo.in
def trimmed = { String url -> url.trim().replaceAll('/+$', '') }
def appUrl = trimmed((findProperty('appUrl') ?: 'http://10.0.2.2:2003').toString())
def apiUrl = trimmed((findProperty('apiUrl') ?: appUrl).toString())

// Builds for an https address (the live app) carry the rider web app's screens inside the APK (assets/web):
// the app serves them itself for appUrl and sends only /api/… to the server (BundledApp.kt), so the server
// only has to run the API. Dev builds (http) load the dev server instead. -PbundleWeb=false/true overrides.
// The screens come from frontend/dist-android: scripts/build-android.ps1 builds them first
// (npm run build:android --prefix frontend).
def bundleWeb = (findProperty('bundleWeb') ?: appUrl.startsWith('https:')).toString().toBoolean()
def webDist = file('../../../frontend/dist-android')
def webAssets = file("${layout.buildDirectory.get().asFile}/generated/webapp")
def copyWebApp = tasks.register('copyWebApp', Sync) {
    from webDist
    into new File(webAssets, 'web')
    doFirst {
        if (!new File(webDist, 'index.html').exists()) {
            throw new GradleException("The rider web app isn't built: run `npm run build:android --prefix frontend` (or scripts/build-android.ps1).")
        }
    }
}
if (bundleWeb) tasks.named('preBuild') { dependsOn copyWebApp }

// Play Store builds (-Pplay=true, the .aab) are signed with BiteVo's own upload key; Google Play refuses the
// public debug key. The key and its passwords stay outside the repo, in ~/.bitevo/rider-upload.properties
// (storeFile, storePassword, keyAlias, keyPassword), made once by scripts/make-upload-key.ps1.
// BITEVO_UPLOAD_PROPERTIES points somewhere else.
def forPlay = (findProperty('play') ?: 'false').toString().toBoolean()
def uploadPropsFile = file(System.getenv('BITEVO_UPLOAD_PROPERTIES') ?: "${System.getProperty('user.home')}/.bitevo/rider-upload.properties")
def uploadProps = new Properties()
if (uploadPropsFile.exists()) uploadPropsFile.withInputStream { uploadProps.load(it) }
if (forPlay && !uploadPropsFile.exists()) {
    throw new GradleException("No upload key at ${uploadPropsFile}: run mobile/scripts/make-upload-key.ps1 once (and back the key up).")
}

android {
    namespace = 'com.bitevo.rider' // the code's package ("in" is a reserved word in Kotlin); the app ID stays in.bitevo.rider
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'in.bitevo.rider'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
        buildConfigField 'String', 'API_URL', "\"${apiUrl}\""
        buildConfigField 'boolean', 'BUNDLED_WEB', String.valueOf(bundleWeb)
        // Plain http is allowed only when the app was built for an http address (the dev server).
        manifestPlaceholders = [usesCleartextTraffic: String.valueOf(appUrl.startsWith('http:') || apiUrl.startsWith('http:'))]
    }
    sourceSets {
        main {
            if (bundleWeb) assets.srcDir(webAssets)
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        // React Native's public debug key, as in the customer app: fine for installing the APK directly.
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        // BiteVo's own upload key, for the Play Store (above).
        if (forPlay) {
            upload {
                storeFile = file(uploadProps.getProperty('storeFile'))
                storePassword = uploadProps.getProperty('storePassword')
                keyAlias = uploadProps.getProperty('keyAlias')
                keyPassword = uploadProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig = forPlay ? signingConfigs.upload : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            // LocationSenderTest runs against a dev API only when given one: gradlew test -PtestApi=http://127.0.0.1:4002
            systemProperty 'bitevo.testApi', (findProperty('testApi') ?: '').toString()
            testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true; exceptionFormat = 'full' }
        }
    }
}

dependencies {
    // FileProvider: hands the camera app a place to save the delivery photo.
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517' // Android's own org.json is only a stub in JVM tests
}
